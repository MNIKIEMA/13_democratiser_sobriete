version: "3.9"

services:
  kotaemon:
    build:
      context: .
      dockerfile: ./Dockerfile
      target: full
    pull_policy: if_not_present
    entrypoint: ["/bin/sh", "-c", "uv pip install -e /app/taxonomy && tail -f /dev/null"]
    environment:
      GRADIO_SERVER_NAME: 0.0.0.0
      GRADIO_SERVER_PORT: 7860
      OLLAMA_DEPLOYMENT: docker
      VECTOR_STORE_DEPLOYMENT: docker
      # PDF_FOLDER: /app/data/pdfs
    ports:
      - "7860:7860"
    volumes:
      - "../kotaemon/flowsettings.py:/app/flowsettings.py"
      - "../kotaemon/libs:/app/kotaemon/libs"
      - "../kotaemon/ktem_app_data:/app/kotaemon/ktem_app_data"
      - "./pipeline_scripts:/app/pipeline_scripts"
      - "./taxonomy:/app/taxonomy"
    depends_on:
      - ollama
      - qdrant

  ollama:
    image: ollama/ollama
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - "./ollama:/root/.ollama"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    expose:
      - "6333"
      - "6334"
      - "6335"
    volumes:
      - "./qdrant_data:/qdrant/storage"
